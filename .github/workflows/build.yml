name: Build plugin

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenCapture-win64
          path: build/Release/ScreenCapture.dll

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j 4

      - name: Sign bundle (ad-hoc) and zip
        run: |
          codesign --force --deep --sign - build/ScreenCapture.bundle
          codesign --verify --strict build/ScreenCapture.bundle
          ditto -c -k --keepParent build/ScreenCapture.bundle ScreenCapture-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenCapture-mac
          path: ScreenCapture-mac.zip
